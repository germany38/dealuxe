[build]
  # Installs dependencies first when the build starts without node_modules
  # (a CLI `netlify deploy` build runs straight from the source tree, with no
  # install step, so `vite` and `@netlify/blobs` were missing). A normal CI
  # build already has them, so there the guard is a no-op. `npx` resolves the
  # local vite binary whether or not node_modules/.bin is on PATH.
  command = "(test -x node_modules/.bin/vite || npm ci --include=dev --no-audit --no-fund) && node scripts/sync-sources.mjs && npx --no-install vite build"
  publish = "dist/client"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The on-demand translation endpoint reads the page body from disk rather than
# accepting it from the browser, so the DeepL quota can only be spent on this
# site's own pages. Synced posts are written before functions are bundled, so
# they are included too.
[functions.translate]
  included_files = ["src/data/blog/posts/*.json", "src/data/jobs/posts/*.json", "src/data/sweeps/posts/*.json"]

[build.environment]
  STRIPE_PUBLISHABLE_KEY = "pk_live_51ThxmWREvSQNqJ2fnKKEDbnPmP4O3sEcSUcNwFuHOC8PLLCdzE1DPHVy3YRAhqzs4nMOwYIkH2cyZVvf1SCJKbrE00k2aMW4Tt"

# Journal cover art and inline post images come from third-party hosts: the
# Medium and Tumblr CDNs (images that shipped with the imported posts), iStock
# (licensed covers assigned in src/lib/journalCovers.ts) and Unsplash (the
# curated fallback pool). Allow the Netlify Image CDN to resize and re-encode
# them so posts do not ship full-resolution third-party images.
#
# Wikimedia Commons is deliberately absent: the Image CDN's fetcher is rate
