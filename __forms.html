<!DOCTYPE html>
<!-- Build-time form detection only (Netlify Forms). The real forms are rendered by the app. -->
<html>
  <body>
    <form name="privacy-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="privacy-request" />
      <select name="request"><option>x</option></select>
      <input name="email" />
      <textarea name="details"></textarea>
      <input name="bot-field" />
    </form>
<script src="/temu-promo.js"></script>
  </body>
</html>
